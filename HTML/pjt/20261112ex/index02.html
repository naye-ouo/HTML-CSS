<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Document</title>
    </head>
    <body>
        
        <!-- 폼(양식) 관련 태그 -->
        <!-- 서버와 통신하기 위한 태그라서 매우 중요함 -->
        
        <form action="서버 uri" method="post" name="signupform">
        <!-- action과 method와 name이 대표적인 속성 -->
        <!-- action 내가 지금 작성하고 있는 서버의 데이터가 어디로 갈 건지 타겟 주소를 적는 곳  -->
        <!-- method 클라이언트가 서버로 데이터를 보낼 때 데이터를 보내는 방법 get , post  -->
        <!-- name은 양식의 이름을 정하는 것 한글은 안됨 -->

            ID: <input type="text" name="memId" placeholder="Input ID"> <br>
            PW: <input type="password" name="memPw" placeholder="Input PW"> <br>
            MAIL: <input type="email" name="memMail" placeholder="Input MAIL"> <br> 
            PHONE: 
             <select name="memPhone01">
                <option>010</option>
                <option>016</option>
                <option>017</option>
             </select>
             <input type="text" name="memPhone" placeholder="Input PHONE"> <br>
            HOBBY: 
                축구<input type="checkbox" name="memHobby" value="soccer">, &nbsp;&nbsp;
                야구<input type="checkbox" name="memHobby" value="baseball">, &nbsp;&nbsp;
                배구<input type="checkbox" name="memHobby" value="valleyball">, &nbsp;&nbsp;
                농구<input type="checkbox" name="memHobby" value="basketball">, &nbsp;&nbsp;
                족구<input type="checkbox" name="memHobby" value="football">
                <!-- 하나의 그룹으로 묶기 위해서는 name 이름이 다 똑같아야한다 
                 다국어 처리 때문에 실제로 서버에 데이터 전송할 때는 value 값에 지정된 이름으로 전송된다-->
                <br>
            성구분:
                남성<input type="radio" name="memGender" value="M">, &nbsp;&nbsp;
                여성<input type="radio" name="memGender" value="W">, &nbsp;&nbsp;
                비밀<input type="radio" name="memGender" value="">
                <!-- 만약 name의 이름이 다를 경우 중복 체크가 가능함 -->
                <br>
            국가:
                <select name="memCountry">
                    <option value="kor">대한민국</option>
                    <option value="usa">미국</option>
                    <option value="chi">중국</option>
                    <option value="aus">호주</option>
                    <option value="eng">영국</option>
                </select>
                <br>
            기타:
                <textarea name="memEtc">내용을 입력하세요.</textarea>
                <!-- 하지만 잘 안씀, 이미지나 영상 등 첨부가 되지 않고 only 텍스트만 입력 가능함 -->
                <br>
                <input type="color" value="#fff">
                <br>
                <input type="datetime-local">
                <!-- 날짜 시간 선택 가능 기본 HTML에서 제공 -->
                <br>
                <input type="file">
                <!-- 파일 선택할 수 있게해주는 타입 -->
                <br>

            <input type="submit" value="SIGNUP">
            <!-- 서버로 데이터 전송하는 기능 -->
            <input type="reset" value="RESET">
            <!-- 입력한 정보를 초기화 -->
            <input type="button" value="BUTTON">
            <!-- 아직 기능이 없는 그냥 버튼 자바스크립트로 기능을 구현해야함 -->
            <br>
            <br>
            <br>

        </form>



    </body>
</html>
