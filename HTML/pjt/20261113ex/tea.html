<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Tea</title>
    </head>
    <body>
        <table border="1">
            <!-- 1행 -->
            <thead>
                <th colspan="6"> 한국의 차 </th>
            </thead>
            <!-- 2행 -->
            <tr>
                <td rowspan="6">뿌리차</td>
                <td>인삼차</td>
                <td rowspan="9">과일차</td>
                <td>수정과</td>
                <td rowspan="5">잎차</td>
                <td>뽕잎차</td>
            </tr>
            <!-- 3행 -->
            <tr>
                <td>당귀차</td>
                <td>유자차</td>
                <td>감잎차</td>
            </tr>
            <!-- 4행 -->
            <tr>
                <td>생강차</td>
                <td>구기자차</td>
                <td>솔잎차</td>
            </tr>
            <!-- 5행 -->
            <tr>
                <td>칡차</td>
                <td>대추차</td>
                <td>국화차</td>
            </tr>
            <!-- 6행 -->
            <tr>
                <td>둥글레차</td>
                <td>오미자차</td>
                <td>이슬차</td>
            </tr>
            <!-- 7행 -->
            <tr>  
                <td>마차</td>
                <td>매실차</td>
                <td rowspan="4">기타</td>
                <td>두충차</td>
            </tr>
            <!-- 8행 -->
            <tr>
                <td rowspan="3">곡물차</td>
                <td>보리차</td>
                <td>모과차</td>
                <td>영지버섯차</td>
            </tr>
            <!-- 9행 -->
            <tr>
                <td>옥수수차</td>
                <td>산수유차</td>
                <td>귤강차</td>
            </tr>
            <!-- 10행 -->
            <tr>
                <td>현미차</td>
                <td>탱자차</td>
                <td>쌍화차</td>
            </tr>
        </table>
    </body>
</html>
