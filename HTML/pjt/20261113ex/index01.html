<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>TABLE</title>
    </head>
    <body>
        
        <!-- <table> 표 -->
        <table border="1">
        <!-- table에 border라는 속성값이 있지만 보통 css에서 작업함  -->
            <!-- <thead>
                thead는 헤드라인처럼 글씨가 두껍게 나옴 근데 잘 안씀 css에서 작업함
                열을 만들 때 th로 만들어야함
                <th colspan="5">대전에 있는 학교 학생 성적</th>
            </thead> -->
            <tbody> <!--원래 있어야 하는 애지만 생략 가능하다 현재 브라우저에서 자동으로 붙여줌-->
                <tr>
                    <td colspan="5"><b>대전에 있는 학교 학생 성적</b></th>
                </tr>
                <tr>
                    <td colspan="5">DW학교</td>
                </tr>
                <!-- 학년 행 -->
                <tr>
                    <td rowspan="2"></td>
                    <td colspan="2">1학년</td>             
                    <td colspan="2">2학년</td>
                </tr>
                <!-- 1행 -->
                <tr>
                    <!-- 열 -->
                    <td>1학기</td>
                    <td>2학기</td>
                    <td>3학기</td>
                    <td>4학기</td>
                </tr>
                <!-- 2행 -->
                <tr>
                    <!-- 열 -->
                    <td>홍길동</td>
                    <td>80</td>
                    <td>90</td>
                    <td>100</td>
                    <td>50</td>
                </tr>
                <!-- 3행 -->
                <tr>
                    <!-- 열 -->
                    <td>박찬호</td>
                    <td>80</td>
                    <td>100</td>
                    <td>50</td>
                    <td>60</td>
                </tr>
                <!-- 4행 -->
                <tr>
                    <!-- 열 -->
                    <td>박세리</td>
                    <td>75</td>
                    <td>90</td>
                    <td>50</td>
                    <td>45</td>
                </tr>
            </tbody>
        </table>

    </body>
</html>
