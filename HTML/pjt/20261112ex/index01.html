<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Document</title>
    </head>
    <body>
        
        <!-- 목록 태그들 중요함 -->
        <!-- <ul>, <ol>, <dl> -->

        <!-- <ul> unorder list 불릿bullet 가장 많이 씀 -->
        <ul>
            <li>짜장면</li>
            <li>짬뽕</li>
            <li>탕수육</li>
            <li>볶음밥</li>
        </ul>    

        <!-- <ol> order list 숫자 -->
        <ol>
            <li>불고기</li>
            <li>비빔밥</li>
            <li>파전</li>
            <li>설렁탕</li>
        </ol>    

        <!-- <dl> description list 설명 잘 안씀-->
        <dl>
            <dt>소개할 설명의 제목</dt>
            <dd>설명 첨가</dd>

            <dt>HTML</dt>
            <dd>웹 문서를 구조화 하는 마크업 언어이다.</dd>
        </dl>

        
    </body>
</html>
